<!doctype html>
<html
	lang="{{ site.Language.Locale }}"
	dir="{{ or site.Language.Direction `ltr` }}"
>
	<head>
		{{ partial "head.html" . }}
	</head>
	<body
		class="{{ if .IsHome }}is-home{{ else }}page-{{ .Title | urlize }}{{ end }}"
	>
		<div class="site-wrapper">
			{{ partial "header.html" . }}
			<main class="section-main-content">
				<div class="page-content">{{ block "main" . }}{{ end }}</div>
			</main>
		</div>
		<!-- Scroll Depth Gauge -->
		<div class="scroll-depth-gauge" aria-hidden="true">
			<div class="gauge-line">
				<div class="gauge-progress"></div>
				<div class="gauge-diver">
					<svg class="diver-svg" viewBox="0 0 1200 1200" fill="currentColor">
						<defs>
							<clipPath id="diver-clip-b">
								<path d="m287 347h599v545h-599z"/>
							</clipPath>
							<clipPath id="diver-clip-a">
								<path d="m1062.8 332.82-729.96-195.59-195.59 729.96 729.96 195.59z"/>
							</clipPath>
						</defs>
						<g clip-path="url(#diver-clip-b)">
							<g clip-path="url(#diver-clip-a)">
								<path d="m503.59 347.28c-5.793 40.414 12.348 77.18 40.316 119.64-23.93 29.145-32.039 61.641-33.816 96.68 11.363 15.039 24.43 27.824 41.18 37.523 5.8828 3.4062 12.801 6.6758 20.395 9.6211-22.176-50.273-1.1211-99.051 19.109-134.2-41.07-50.043-73.324-77.473-87.18-129.27zm292.12 265.45-169.47-36.582c-22.453 3.5859-24.961 32.078-4.5352 40.598l168.62 36.637c20.391-6.1055 25.203-28.691 5.3867-40.652zm70.457 75.812c-18.09-10.477-41.215-4.2695-51.652 13.859s-4.2305 41.316 13.859 51.793c18.09 10.477 41.215 4.2695 51.652-13.859 10.438-18.129 4.2305-41.32-13.859-51.793zm-422.86-219.96c-42.438 27.949-90.562 35.098-155.57 41.223 53.672 13.57 87.648 15.738 129.12 4.7344 86.402 155.08 138.11 202.53 317.05 227.36 1.7344 88.543 30.906 114.19 107.15 149.59 16.953 1.0664 28.293-18.633 18.898-32.828-73.438-25.016-95.16-63.855-72.379-164.46 2.8672-13.957-3.6602-21.637-12.094-24.512-77.215-18.453-179.07-24.91-231.78-55.43-52.703-30.516-73.176-86.141-100.39-145.67z"/>
							</g>
						</g>
					</svg>
				</div>
			</div>
			<div class="gauge-marks">
				<div class="gauge-mark" style="top: 0%"><span>0m</span></div>
				<div class="gauge-mark" style="top: 33%"><span>10m</span></div>
				<div class="gauge-mark" style="top: 66%"><span>20m</span></div>
				<div class="gauge-mark" style="top: 100%"><span>30m</span></div>
			</div>
		</div>
		{{ partial "head/js.html" . }}
	</body>
</html>
