<!doctype html>
<html
	lang="{{ site.Language.Locale }}"
	dir="{{ or site.Language.Direction `ltr` }}"
>
	<head>
		{{ partial "head.html" . }}
	</head>
	<body
		class="{{ if .IsHome }}is-home{{ else }}page-{{ .Title | urlize }}{{ end }}"
	>
		<div class="site-wrapper">
			{{ partial "header.html" . }}
			<main class="section-main-content">
				<div class="page-content">{{ block "main" . }}{{ end }}</div>
			</main>
		</div>
		<!-- Scroll Depth Gauge -->
		<div class="scroll-depth-gauge" aria-hidden="true">
			<div class="gauge-line">
				<div class="gauge-progress"></div>
				<div class="gauge-diver">
					<svg class="diver-svg" viewBox="0 0 24 24" fill="currentColor">
						<!-- Bubbles rising -->
						<circle cx="14" cy="5" r="0.7" opacity="0.7" />
						<circle cx="16" cy="8" r="1" opacity="0.8" />
						<circle cx="15" cy="12" r="0.5" opacity="0.6" />

						<!-- Scuba Tank (on the back, tilted down-right) -->
						<rect x="7" y="11" width="3" height="7" rx="1.5" transform="rotate(-45 8.5 14.5)" />

						<!-- Torso / Body -->
						<rect x="9" y="12" width="4" height="9" rx="2" transform="rotate(-45 11 16.5)" />

						<!-- Head -->
						<circle cx="16" cy="18" r="2" />

						<!-- Mask/Goggles -->
						<rect x="17" y="16.5" width="2" height="1.5" rx="0.5" transform="rotate(-45 18 17.25)" />

						<!-- Regulator/Snorkel line -->
						<path d="M 15.5,18.5 Q 16.5,19.5 17.5,18.5" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linecap="round" />

						<!-- Arms (reaching forward/down) -->
						<path d="M 12.5,18 L 14.5,21.5 M 12.5,18 L 15,20.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />

						<!-- Legs & Fins -->
						<!-- Leg 1 -->
						<path d="M 9.5,13.5 L 5.5,9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
						<!-- Fin 1 -->
						<polygon points="5.5,9.5 3.5,10.5 3,7.5 5,8.5" />

						<!-- Leg 2 -->
						<path d="M 8.5,12.5 L 4.5,8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
						<!-- Fin 2 -->
						<polygon points="4.5,8.5 2.5,9.5 2,6.5 4,7.5" />
					</svg>
					<span class="gauge-depth-label">0m</span>
				</div>
			</div>
			<div class="gauge-marks">
				<div class="gauge-mark" style="top: 0%"><span>0m</span></div>
				<div class="gauge-mark" style="top: 33%"><span>10m</span></div>
				<div class="gauge-mark" style="top: 66%"><span>20m</span></div>
				<div class="gauge-mark" style="top: 100%"><span>30m</span></div>
			</div>
		</div>
		{{ partial "head/js.html" . }}
	</body>
</html>
