[tools]
hugo = "0.165.0"
"go:github.com/gohugoio/gotmplfmt" = "latest"
"npm:oxfmt" = "latest"

[tasks.fmt]
description = "Format Go templates with gotmplfmt, and JS/CSS/TOML with oxfmt"
run = ["gotmplfmt -w site/themes/my-theme/layouts", "oxfmt --write ."]

[tasks.dev]
description = "Run Hugo development server"
dir = "site"
run = "hugo server -D"

[tasks.build]
description = "Build the Hugo site for production"
dir = "site"
run = "hugo --gc --minify"

[tasks.build-test]
description = "Build the Hugo site for the Netlify staging environment"
dir = "site"
run = "hugo --baseURL=\"https://bespoke-boba-be8025.netlify.app/\" --gc --minify"
